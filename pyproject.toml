[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mujoco-viser-usage"
version = "0.1.0"
description = "MuJoCo robotics experiments with a Viser browser viewer"
requires-python = ">=3.12"
dependencies = ["mujoco>=3.3,<4", "viser>=1.0,<2", "numpy>=2,<3", "trimesh>=4.6,<5"]

[project.scripts]
mujoco-viser-usage = "mujoco_viser_usage.app:main"
mujoco-viser-rl = "mujoco_viser_usage.rl.dashboard:main"
mujoco-viser-train = "mujoco_viser_usage.rl.train:main"

[project.optional-dependencies]
rl = [
    "gymnasium>=1.2,<2",
    "psutil>=7,<8",
    "stable-baselines3>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.50",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mujoco_viser_usage"]
